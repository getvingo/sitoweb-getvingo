<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ oggetto }}</title></head>
<body style="margin:0;padding:0;background:#F3F4F0;font-family:Red Hat Text,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#11171D">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F4F0;padding:24px 12px">
<tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:14px;overflow:hidden;border:1px solid #E0E3DE">
    <tr><td style="background:#11171D;padding:18px 24px;border-bottom:4px dashed #00D68F"><img src="{{ (config.BASE_URL or 'https://getvingo.com')|trim('/') }}/static/icone/logo-email.png" height="28" alt="getvingo" style="display:block;height:28px;width:auto;border:0;color:#FFFFFF;font-size:22px;font-weight:800"></td></tr>
    <tr><td style="padding:28px 24px 8px;font-size:16px;line-height:1.55">{% block corpo %}{% endblock %}</td></tr>
    <tr><td style="padding:8px 24px 24px;font-size:13px;line-height:1.5;color:#5A6672">{% block nota %}{% endblock %}</td></tr>
  </table>
  <p style="font-size:12px;color:#5A6672;margin:16px 0 0">Getvingo · Ogni cosa ha il suo VIN.<br>Email automatica: non rispondere a questo messaggio.</p>
</td></tr>
</table>
</body></html>
