{% macro pulsante(link, testo) %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0"><tr><td style="background:#2C1A5C;border-radius:12px">
  <a href="{{ link }}" style="display:inline-block;padding:14px 24px;color:#FFFFFF;font-weight:700;text-decoration:none;font-size:16px">{{ testo }}</a>
</td></tr></table>
<p style="font-size:13px;color:#5A5470;margin:0 0 8px">Se il pulsante non funziona, copia questo indirizzo nel browser:<br><a href="{{ link }}" style="color:#1F6FB2;word-break:break-all">{{ link }}</a></p>
{% endmacro %}
