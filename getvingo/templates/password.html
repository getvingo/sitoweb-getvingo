{% extends "base.html" %}
{% from "_macro.html" import csrf_input, indietro %}
{% block titolo %}Cambia password · Getvingo{% endblock %}
{% block contenuto %}
{{ indietro(url_for('main.profilo'), 'Il mio profilo') }}
<div class="titolo-pagina"><div><div class="sopratitolo">{{ g.utente.email }}</div><h1>Cambia password</h1></div></div>
<form method="post" class="scheda" data-una-volta>
  {{ csrf_input() }}
  <label class="campo"><span>Password attuale</span><input type="password" name="attuale" required autocomplete="current-password"></label>
  <label class="campo"><span>Nuova password</span><input type="password" name="nuova" required minlength="8" autocomplete="new-password"><small>Almeno 8 caratteri.</small></label>
  <label class="campo"><span>Ripeti la nuova password</span><input type="password" name="conferma" required minlength="8" autocomplete="new-password"></label>
  <button class="btn primario pieno">Salva la nuova password</button>
</form>
{% endblock %}
