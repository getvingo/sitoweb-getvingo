{% extends "base.html" %}
{% block titolo %}Accedi · Getvingo{% endblock %}
{% block corpo %}
<div class="accesso">
  <div style="width:100%;max-width:400px">
    <div class="marchio"><img src="{{ url_for('static', filename='logo-negativo.svg') }}" alt="Getvingo"></div>
    <p class="payoff">Ogni auto, sempre al suo posto.</p>
    <div class="scheda">
      {% for categoria, messaggio in get_flashed_messages(with_categories=true) %}
        <div class="avviso {{ categoria }}">{{ messaggio }}</div>
      {% endfor %}
      <form method="post">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <label class="campo"><span>Email</span><input type="email" name="email" required autofocus autocomplete="username"></label>
        <label class="campo"><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
        <button class="btn primario pieno">Accedi</button>
      </form>
      <p class="link-accesso"><a href="{{ url_for('auth.password_dimenticata') }}">Password dimenticata?</a></p>
    </div>
    <p class="payoff" style="margin:18px 0 0"><a href="{{ url_for('auth.privacy') }}" style="color:inherit;text-decoration:underline">Informativa privacy</a></p>
  </div>
</div>
{% endblock %}
